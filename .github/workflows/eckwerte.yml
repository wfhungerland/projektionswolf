name: Eckwerte laden
on:
  workflow_dispatch:
  push:
    paths: [tools/eckwerte_laden.py, data/manuell/eckwerte_urls.csv, .github/workflows/eckwerte.yml]
permissions:
  contents: write
jobs:
  laden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas requests pdfplumber
      - run: python tools/eckwerte_laden.py
      - run: |
          git config user.name "projektionswolf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/eckwerte
          git commit -m "Eckwert-Tabellen geladen" || exit 0
          git pull --rebase && git push
