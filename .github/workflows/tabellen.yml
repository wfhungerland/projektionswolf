name: Prognosetabellen laden
on:
  workflow_dispatch:
  push:
    paths: [tools/tabellen_laden.py, data/manuell/tabellen_urls.csv, .github/workflows/tabellen.yml]
permissions:
  contents: write
jobs:
  laden:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas requests pdfplumber openpyxl
      - run: python tools/tabellen_laden.py
      - run: |
          git config user.name "projektionswolf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/tabellen
          git commit -m "Prognosetabellen geladen" || exit 0
          git pull --rebase && git push
