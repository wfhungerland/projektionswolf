name: Daten und Schätzung aktualisieren

on:
  schedule:
    - cron: "41 6 * * 1"   # montags 06:41 UTC
  workflow_dispatch:
  push:
    paths:
      - "projektionswolf/**"
      - "data/manuell/**"
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: update-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Abhängigkeiten
        run: pip install -e ".[dev]"
      - name: Rohdaten laden
        run: python -m projektionswolf fetch
      - name: Tests (inkl. Nachbau aller BMWE-Runden)
        run: pytest -q
      - name: Schätzen
        run: python -m projektionswolf run
      - name: Bericht in die Zusammenfassung
        if: always()
        run: cat output/bericht.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Pages-Artefakt hochladen
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Committen
        run: |
          git config user.name "projektionswolf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data output
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git commit -m "Daten und Schätzung aktualisiert ($(date -u +%F))"
          git push

  deploy:
    needs: update
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Webseite veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
